<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found — Dontae Amare</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Ctext x='50%25' y='72%25' font-family='Georgia,serif' font-size='13' font-weight='700' fill='%23f26b1d' text-anchor='middle'%3EDA%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,700;1,300;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --orange: #f26b1d;
  --ink: #0a0a0a; --mid: rgba(10,10,10,0.45); --dim: rgba(10,10,10,0.10);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Inter', sans-serif; font-weight: 300;
  min-height: 100vh;
  display: flex; flex-direction: column;
}
nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 60px;
  border-bottom: 1px solid var(--dim);
}
.n-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; letter-spacing: .08em; font-weight: 700;
  color: var(--ink); text-decoration: none;
}
.n-logo em { color: var(--orange); font-style: italic; }

main {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 60px 40px;
}
.err-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(120px, 20vw, 240px);
  font-weight: 700; line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1.5px var(--orange);
  letter-spacing: -.02em;
  margin-bottom: -16px;
  user-select: none;
}
.err-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(28px, 5vw, 52px);
  font-weight: 700; letter-spacing: -.01em;
  margin-bottom: 20px; line-height: 1.1;
}
.err-title em { font-style: italic; color: var(--orange); }
.err-desc {
  font-size: 14px; line-height: 1.85;
  color: var(--mid); max-width: 400px;
  margin: 0 auto 40px;
}
.err-links {
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
}
.btn-fill {
  font-size: 9px; letter-spacing: .3em; text-transform: uppercase;
  background: var(--orange); color: #fff;
  padding: 13px 28px; text-decoration: none; font-weight: 500;
  transition: background .2s;
}
.btn-fill:hover { background: #ff8533; }
.btn-outline {
  font-size: 9px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--mid); border: 1px solid var(--dim);
  padding: 13px 28px; text-decoration: none;
  transition: color .2s, border-color .2s;
}
.btn-outline:hover { color: var(--ink); border-color: rgba(10,10,10,.3); }

footer {
  border-top: 1px solid var(--dim); padding: 20px 60px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
}
.f-copy { font-size: 9px; letter-spacing: .28em; text-transform: uppercase; color: var(--mid); }

@media (max-width: 640px) {
  nav, footer { padding: 16px 20px; }
  footer { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="n-logo">Dontae <em>Amare</em></a>
</nav>

<main>
  <div class="err-num">404</div>
  <h1 class="err-title">This page<br><em>doesn't exist.</em></h1>
  <p class="err-desc">The link you followed may be broken, moved, or no longer available. Head back home — the music's still there.</p>
  <div class="err-links">
    <a href="index.html" class="btn-fill">Back to Home</a>
    <a href="index.html#music" class="btn-outline">Hear the Music</a>
  </div>
</main>

<footer>
  <div class="f-copy">© 2026 Dontae Amare — All Rights Reserved</div>
  <div class="f-copy">Fort Worth, TX</div>
</footer>

</body>
</html>
